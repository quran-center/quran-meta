# SonarCloud automatic analysis settings

# Generated files are near-identical by design; keep them out of duplication checks.
# - src/<riwaya>.ts: riwaya entry points, generated by scripts/generate-entries.ts
# - src/lists/*Lists.ts: riwaya data tables
# - src/convert/ayahMapData.ts: generated by examples/data-check/generate-ayah-map.ts
# - src/i18n/surah.*.ts: surah name tables
sonar.cpd.exclusions=src/bazzi.ts,src/douri.ts,src/hafs.ts,src/qalun.ts,src/qunbul.ts,src/shuba.ts,src/sousi.ts,src/warsh.ts,src/lists/*Lists.ts,src/convert/ayahMapData.ts,src/i18n/surah.*.ts

sonar.sources=src
sonar.tests=tests
